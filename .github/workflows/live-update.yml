name: live-update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: update live.json
        run: python3 tools/live_update.py

      - name: commit and push
        run: |
          set -e
          if git diff --quiet -- data/live.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "live-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "live update $(date -u +'%Y-%m-%d %H:%MZ')"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
