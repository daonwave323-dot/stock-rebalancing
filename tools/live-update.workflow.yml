# 이 파일은 워크플로 '사본'입니다. 깃허브 앱에 workflows 권한이 없어
# .github/workflows/live-update.yml 을 자동으로 올리지 못했습니다(사용자가 웹에서 한 번 만들어야 함).
name: live-update

# 5분마다 야후 시세를 받아 'live' 브랜치의 data/live.json 으로 커밋한다.
# 화면(깃허브 페이지)은 그 파일을 그대로 읽는다 — 브라우저에 어떤 키도 가지 않는다(키를 쓰지 않는다).
# main 브랜치에는 커밋하지 않는다(기록·페이지 빌드를 건드리지 않으려고).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 저장소 받기(main — 스크립트와 티커 목록)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 시세 받아 임시 파일로 쓰기
        run: python3 tools/live_update.py --out "$RUNNER_TEMP/live.json"

      - name: live 브랜치에 커밋·푸시
        run: |
          set -e
          git config user.name "live-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin live > /dev/null 2>&1; then
            git fetch origin live
            git checkout -B live FETCH_HEAD
          else
            git checkout --orphan live
            git rm -rf --cached . > /dev/null
          fi
          mkdir -p data
          cp "$RUNNER_TEMP/live.json" data/live.json
          printf '%s\n' "5분마다 자동 갱신되는 시세 파일입니다. 화면은 이 파일만 읽습니다." > data/README.txt
          git add data/live.json data/README.txt
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "시세 자동 갱신 $(date -u +'%Y-%m-%d %H:%MZ')"
          git push origin HEAD:live
